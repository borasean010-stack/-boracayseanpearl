<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERP Dashboard | Pearl Of Sean Boracay</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#29D3D0",
                        secondary: "#062B43",
                        accent: "#F2C94C",
                        light: "#F8F9FA",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        heading: ["Montserrat", "serif"],
                    },
                },
            },
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-sidebar {
            background: #062B43;
            height: 100vh;
        }
        .nav-item.active {
            background: rgba(41, 211, 208, 0.1);
            color: #29D3D0;
            border-right: 4px solid #29D3D0;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-paid { background: #DBEAFE; color: #1E40AF; }
        .status-confirmed { background: #D1FAE5; color: #065F46; }
        .status-cancelled { background: #FEE2E2; color: #991B1B; }

        #login-screen {
            background: #062B43;
            background-image: radial-gradient(circle at top right, rgba(41, 211, 208, 0.1), transparent);
        }
    </style>
</head>
<body class="bg-light text-secondary antialiased font-sans">

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white rounded-[2.5rem] p-10 shadow-2xl text-center">
            <img src="pearl_of_sean_logo.png" alt="Logo" class="h-16 mx-auto mb-8">
            <h1 class="text-2xl font-heading font-bold mb-2">ERP Access</h1>
            <p class="text-gray-500 text-sm mb-8">Administrative portal for Pearl Of Sean</p>
            <form id="login-form" class="space-y-4">
                <input type="text" id="login-id" placeholder="Admin ID (e.g., luca)" required class="w-full bg-light border border-gray-100 rounded-2xl px-6 py-4 outline-none focus:border-primary transition-all">
                <button type="submit" class="w-full bg-secondary text-white py-4 rounded-2xl font-bold hover:bg-primary transition-all shadow-lg mt-4">Login to Dashboard</button>
            </form>
            <p id="login-error" class="text-red-500 text-xs mt-4 hidden">Invalid Admin ID.</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden flex min-h-screen">
        <aside class="admin-sidebar w-64 fixed inset-y-0 left-0 hidden lg:flex flex-col">
            <div class="p-8">
                <div class="flex items-center gap-3">
                    <img src="pearl_of_sean_logo.png" alt="Logo" class="h-8 filter brightness-0 invert">
                    <span class="text-white font-heading font-bold text-lg">ERP Admin</span>
                </div>
            </div>
            <nav class="mt-8 flex-grow">
                <button data-tab="bookings" class="nav-item active w-full flex items-center gap-4 px-8 py-4 text-gray-400 hover:text-white transition-all text-sm font-bold"><i class="ph ph-calendar-check text-xl"></i> Bookings</button>
                <button data-tab="tours" class="nav-item w-full flex items-center gap-4 px-8 py-4 text-gray-400 hover:text-white transition-all text-sm font-bold"><i class="ph ph-sailboat text-xl"></i> Tour Management</button>
                <button data-tab="stats" class="nav-item w-full flex items-center gap-4 px-8 py-4 text-gray-400 hover:text-white transition-all text-sm font-bold"><i class="ph ph-chart-line-up text-xl"></i> Statistics</button>
            </nav>
            <div class="p-8 border-t border-white/5">
                <button id="logout-btn" class="w-full flex items-center gap-4 text-red-400 hover:text-red-300 font-bold text-sm"><i class="ph ph-sign-out text-xl"></i> Logout</button>
            </div>
        </aside>

        <main class="lg:ml-64 flex-grow flex flex-col">
            <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-30">
                <div class="flex items-center gap-4">
                    <h2 id="current-tab-title" class="text-xl font-heading font-bold">Booking Reservations</h2>
                    <button id="db-test-btn" class="bg-accent text-accent-700 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest hover:scale-105 transition-all">DB Connection Test</button>
                </div>
                <div class="flex items-center gap-6">
                    <span id="admin-user-email" class="text-sm font-medium text-gray-400">admin@pearl.of.sean</span>
                    <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold">AD</div>
                </div>
            </header>

            <div id="tab-content" class="p-8">
                <div id="tab-bookings" class="tab-pane">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl bg-primary/10 text-primary flex items-center justify-center text-2xl"><i class="ph ph-calendar-check"></i></div>
                            <div><p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Bookings</p><h4 id="stat-total-bookings" class="text-2xl font-bold">0</h4></div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl bg-accent/10 text-accent-700 flex items-center justify-center text-2xl"><i class="ph ph-currency-circle-dollar"></i></div>
                            <div><p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Revenue</p><h4 id="stat-total-revenue" class="text-2xl font-bold">0 PHP</h4></div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl bg-secondary/10 text-secondary flex items-center justify-center text-2xl"><i class="ph ph-users"></i></div>
                            <div><p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Guests</p><h4 id="stat-total-guests" class="text-2xl font-bold">0</h4></div>
                        </div>
                    </div>

                    <!-- Date Tabs -->
                    <div class="flex border-b border-gray-100 mb-6 overflow-x-auto no-scrollbar">
                        <button data-date-tab="today" class="date-tab active px-6 py-3 text-sm font-bold border-b-2 border-primary text-primary transition-all whitespace-nowrap">Today</button>
                        <button data-date-tab="upcoming" class="date-tab px-6 py-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-secondary transition-all whitespace-nowrap">Upcoming</button>
                        <button data-date-tab="past" class="date-tab px-6 py-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-secondary transition-all whitespace-nowrap">Past</button>
                        <button data-date-tab="all" class="date-tab px-6 py-3 text-sm font-bold border-b-2 border-transparent text-gray-400 hover:text-secondary transition-all whitespace-nowrap">All Bookings</button>
                    </div>

                    <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-start md:items-center">
                        <div class="flex gap-4">
                            <select id="filter-tour" class="bg-white border border-gray-100 rounded-xl px-4 py-2 text-sm font-medium outline-none focus:border-primary">
                                <option value="all">All Tours</option>
                                <option value="yacht">Yacht Hopping</option>
                                <option value="land">Land Tour</option>
                                <option value="whale">Whale Shark</option>
                                <option value="combo">Combo Tours</option>
                            </select>
                            <select id="filter-status" class="bg-white border border-gray-100 rounded-xl px-4 py-2 text-sm font-medium outline-none focus:border-primary">
                                <option value="all">All Status</option>
                                <option value="Pending Payment">Pending</option>
                                <option value="Payment Complete">Paid</option>
                                <option value="Confirmed">Confirmed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="relative w-full md:w-64">
                            <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="search-input" placeholder="Search customer..." class="w-full bg-white border border-gray-100 rounded-xl pl-12 pr-4 py-2 text-sm outline-none focus:border-primary">
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-light border-b border-gray-100">
                                <tr>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Status</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Date</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Customer</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Tour</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Pax</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Total</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Method</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="bookings-list" class="divide-y divide-gray-50"></tbody>
                        </table>
                    </div>
                </div>
                <div id="tab-tours" class="tab-pane hidden"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="tours-list"></div></div>
                <div id="tab-stats" class="tab-pane hidden"><div class="grid grid-cols-1 lg:grid-cols-2 gap-8"><div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-gray-100" id="stats-revenue-chart"></div><div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-gray-100" id="stats-volume-chart"></div></div></div>
            </div>
        </main>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-secondary/60 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-6"><div class="max-w-2xl w-full bg-white rounded-[2.5rem] p-10 shadow-2xl relative"><button id="close-modal" class="absolute top-8 right-8 text-gray-400 hover:text-secondary"><i class="ph ph-x text-2xl"></i></button><div id="modal-body"></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, getDocs, updateDoc, deleteDoc, doc, where, addDoc, serverTimestamp, initializeFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDqAd03xpQd_o3yXIFHv5t-BZWL6blvkmQ",
            authDomain: "boracaysean-local.firebaseapp.com",
            projectId: "boracaysean-local",
            storageBucket: "boracaysean-local.appspot.com",
            messagingSenderId: "673386650213",
            appId: "1:673386650213:web:484b15ee8b2d8ec226448c",
            measurementId: "G-DKC8HE000W"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // FORCE LONG-POLLING TO FIX TIMEOUTS
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });

        document.getElementById('db-test-btn').addEventListener('click', async () => {
            alert("Starting DB Write Test (8s timeout)...\nIf this fails, Project ID is wrong or Rules are Locked.");
            const tPromise = new Promise((_, r) => setTimeout(() => r(new Error("Database connection timed out. CHECK RULES!")), 8000));
            try {
                const wPromise = addDoc(collection(db, "bookings"), { customerName: "TEST_" + Date.now(), tourId: "test", status: "Confirmed", createdAt: serverTimestamp(), isTest: true });
                const docRef = await Promise.race([wPromise, tPromise]);
                alert("WRITE SUCCESS! Doc ID: " + docRef.id); loadBookings();
            } catch (e) { alert("WRITE FAILED: " + e.message); }
        });

        let allDisplayRecords = [];
        let currentDateTab = 'today';

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('flex');
                document.getElementById('admin-user-email').textContent = user.email;
                loadBookings();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const adminId = document.getElementById('login-id').value; 
            const email = adminId.includes('@') ? adminId : `${adminId}@pearl.of.sean`;
            const pass = adminId === 'luca' ? 'luca123' : adminId.padEnd(6, '0');
            try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { document.getElementById('login-error').classList.remove('hidden'); }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Navigation Tabs
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const targetTab = item.dataset.tab;
                navItems.forEach(i => i.classList.remove('active')); item.classList.add('active');
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
                document.getElementById(`tab-${targetTab}`).classList.remove('hidden');
                document.getElementById('current-tab-title').textContent = item.textContent.trim();
                if (targetTab === 'bookings') loadBookings();
                if (targetTab === 'stats') loadStats();
                if (targetTab === 'tours') loadTours();
            });
        });

        // Date Tabs
        const dateTabs = document.querySelectorAll('.date-tab');
        dateTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                dateTabs.forEach(t => {
                    t.classList.remove('active', 'border-primary', 'text-primary');
                    t.classList.add('border-transparent', 'text-gray-400');
                });
                tab.classList.add('active', 'border-primary', 'text-primary');
                tab.classList.remove('border-transparent', 'text-gray-400');
                currentDateTab = tab.dataset.dateTab;
                applyFiltersAndRender();
            });
        });

        // Filters and Search
        document.getElementById('filter-tour').addEventListener('change', applyFiltersAndRender);
        document.getElementById('filter-status').addEventListener('change', applyFiltersAndRender);
        document.getElementById('search-input').addEventListener('input', applyFiltersAndRender);

        async function loadBookings() {
            const list = document.getElementById('bookings-list');
            list.innerHTML = '<tr><td colspan="8" class="px-6 py-10 text-center">Loading from database...</td></tr>';
            try {
                const q = query(collection(db, "bookings"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                allDisplayRecords = [];
                
                let totalB = 0, totalR = 0, totalG = 0;
                
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    totalB++; 
                    totalR += (data.totalPrice || 0); 
                    totalG += (data.paxAdult || 0) + (data.paxChild || 0);

                    // Helper to create a record object
                    const createRecord = (tourName, date, isSubTour = false) => {
                        return {
                            id: id,
                            customerName: data.customerName || 'N/A',
                            contactPhone: data.contactPhone || '',
                            contactEmail: data.contactEmail || '',
                            tourName: tourName,
                            tourId: data.tourId,
                            date: date ? (date.toDate ? date.toDate() : new Date(date.seconds * 1000)) : null,
                            paxAdult: data.paxAdult || 0,
                            paxChild: data.paxChild || 0,
                            totalPrice: data.totalPrice || 0,
                            paymentMethod: data.paymentMethod || 'GCash',
                            status: data.status || 'Pending Payment',
                            createdAt: data.createdAt ? (data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt.seconds * 1000)) : null,
                            isSubTour: isSubTour
                        };
                    };

                    if (data.tourId === 'combo1') { // Yacht + Whale
                        allDisplayRecords.push(createRecord('Yacht (Combo)', data.tourDate, true));
                        allDisplayRecords.push(createRecord('Whale (Combo)', data.tourDate_2, true));
                    } else if (data.tourId === 'combo2') { // Whale + Land
                        allDisplayRecords.push(createRecord('Whale (Combo)', data.tourDate, true));
                        allDisplayRecords.push(createRecord('Land (Combo)', data.tourDate_2, true));
                    } else if (data.tourId === 'combo3') { // Yacht + Land
                        allDisplayRecords.push(createRecord('Yacht (Combo)', data.tourDate, true));
                        allDisplayRecords.push(createRecord('Land (Combo)', data.tourDate_2, true));
                    } else {
                        // Standard tour
                        let tourName = data.tourName || data.tourId || 'N/A';
                        if (data.tourId === 'yacht') tourName = 'Pearl Hopping';
                        if (data.tourId === 'land') tourName = 'Land Tour';
                        if (data.tourId === 'whale') tourName = 'Whale Shark';
                        allDisplayRecords.push(createRecord(tourName, data.tourDate));
                    }
                });

                document.getElementById('stat-total-bookings').textContent = totalB;
                document.getElementById('stat-total-revenue').textContent = `${totalR.toLocaleString()} PHP`;
                document.getElementById('stat-total-guests').textContent = totalG;
                
                applyFiltersAndRender();
            } catch (e) { 
                console.error(e);
                list.innerHTML = `<tr><td colspan="8" class="px-6 py-10 text-center text-red-500">Error loading data: ${e.message}</td></tr>`;
            }
        }

        function applyFiltersAndRender() {
            const list = document.getElementById('bookings-list');
            const tourFilter = document.getElementById('filter-tour').value;
            const statusFilter = document.getElementById('filter-status').value;
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            let filtered = allDisplayRecords.filter(rec => {
                // 1. Date Tab Filter
                if (currentDateTab === 'today') {
                    if (!rec.date) return false;
                    const d = new Date(rec.date); d.setHours(0,0,0,0);
                    if (d.getTime() !== today.getTime()) return false;
                } else if (currentDateTab === 'upcoming') {
                    if (!rec.date) return false;
                    const d = new Date(rec.date); d.setHours(0,0,0,0);
                    if (d.getTime() <= today.getTime()) return false;
                } else if (currentDateTab === 'past') {
                    if (!rec.date) return false;
                    const d = new Date(rec.date); d.setHours(0,0,0,0);
                    if (d.getTime() >= today.getTime()) return false;
                }

                // 2. Tour Filter
                if (tourFilter !== 'all') {
                    if (tourFilter === 'combo') {
                        if (!rec.tourId.startsWith('combo')) return false;
                    } else {
                        if (!rec.tourId.toLowerCase().includes(tourFilter)) return false;
                    }
                }

                // 3. Status Filter
                if (statusFilter !== 'all' && rec.status !== statusFilter) return false;

                // 4. Search Filter
                if (searchQuery) {
                    const match = rec.customerName.toLowerCase().includes(searchQuery) || 
                                  rec.contactPhone.toLowerCase().includes(searchQuery) || 
                                  rec.contactEmail.toLowerCase().includes(searchQuery);
                    if (!match) return false;
                }

                return true;
            });

            // Sort by Date (Earliest first for Today/Upcoming, Latest first for Past/All)
            filtered.sort((a, b) => {
                if (!a.date) return 1;
                if (!b.date) return -1;
                return currentDateTab === 'past' || currentDateTab === 'all' ? b.date - a.date : a.date - b.date;
            });

            list.innerHTML = '';
            if (filtered.length === 0) {
                list.innerHTML = '<tr><td colspan="8" class="px-6 py-20 text-center text-gray-400 font-medium">No matching reservations found.</td></tr>';
                return;
            }

            filtered.forEach(rec => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors';
                
                const dateDisplay = rec.date ? rec.date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'N/A';
                
                row.innerHTML = `
                    <td class="px-6 py-4"><span class="status-badge ${getStatusClass(rec.status)}">${rec.status}</span></td>
                    <td class="px-6 py-4">
                        <p class="font-bold text-gray-700">${dateDisplay}</p>
                        ${rec.isSubTour ? '<span class="text-[9px] bg-accent/20 text-accent-700 px-2 py-0.5 rounded-full font-black uppercase tracking-tighter">Part of Combo</span>' : ''}
                    </td>
                    <td class="px-6 py-4">
                        <p class="font-bold text-secondary">${rec.customerName}</p>
                        <p class="text-xs text-gray-400">${rec.contactPhone}</p>
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-[10px] font-black uppercase tracking-wider ${rec.tourId.startsWith('combo') ? 'text-primary' : 'text-gray-500'}">${rec.tourName}</span>
                    </td>
                    <td class="px-6 py-4 text-xs font-bold text-gray-500">${rec.paxAdult}A, ${rec.paxChild}C</td>
                    <td class="px-6 py-4 font-black text-secondary">${rec.totalPrice.toLocaleString()} <span class="text-[10px] font-normal text-gray-400">PHP</span></td>
                    <td class="px-6 py-4"><span class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">${rec.paymentMethod}</span></td>
                    <td class="px-6 py-4"><button class="text-primary font-black text-[10px] uppercase tracking-widest hover:scale-110 transition-all view-btn" data-id="${rec.id}">Manage</button></td>
                `;
                list.appendChild(row);
            });

            document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => viewBookingDetail(b.dataset.id)));
        }

        async function viewBookingDetail(id) {
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            modal.classList.remove('hidden');
            body.innerHTML = '<div class="flex flex-col items-center justify-center py-20"><i class="ph ph-spinner animate-spin text-4xl text-primary mb-4"></i><p class="font-bold text-gray-400">Fetching Details...</p></div>';
            try {
                const snap = await getDocs(query(collection(db, "bookings"), where("__name__", "==", id)));
                if (snap.empty) return;
                const data = snap.docs[0].data();
                
                const date1 = data.tourDate ? (data.tourDate.toDate ? data.tourDate.toDate().toLocaleDateString() : new Date(data.tourDate.seconds*1000).toLocaleDateString()) : 'N/A';
                const date2 = data.tourDate_2 ? (data.tourDate_2.toDate ? data.tourDate_2.toDate().toLocaleDateString() : new Date(data.tourDate_2.seconds*1000).toLocaleDateString()) : null;
                const created = data.createdAt ? (data.createdAt.toDate ? data.createdAt.toDate().toLocaleString() : new Date(data.createdAt.seconds*1000).toLocaleString()) : 'N/A';

                body.innerHTML = `
                    <h3 class="text-2xl font-heading font-bold mb-2">Reservation Detail</h3>
                    <p class="text-xs text-gray-400 mb-8 uppercase tracking-widest">Booked on: ${created}</p>
                    
                    <div class="grid grid-cols-2 gap-8 mb-10 text-sm">
                        <div class="bg-light p-4 rounded-2xl">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">Customer info</label>
                            <p class="font-bold text-lg text-secondary">${data.customerName}</p>
                            <p class="text-gray-500">${data.contactPhone}</p>
                            <p class="text-gray-500 text-xs mt-1">${data.contactEmail || ''}</p>
                        </div>
                        <div class="bg-light p-4 rounded-2xl">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">Tour Package</label>
                            <p class="font-bold text-lg text-primary uppercase">${data.tourName || data.tourId}</p>
                            <p class="text-gray-500 font-bold">${data.paxAdult} Adults, ${data.paxChild} Children</p>
                        </div>
                        <div class="bg-light p-4 rounded-2xl">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">Schedule</label>
                            <div class="space-y-1">
                                <p class="font-bold text-secondary">${date1} ${data.tourId.startsWith('combo') ? '(Tour 1)' : ''}</p>
                                ${date2 ? `<p class="font-bold text-secondary">${date2} (Tour 2)</p>` : ''}
                            </div>
                        </div>
                        <div class="bg-light p-4 rounded-2xl">
                            <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-2">Payment Status</label>
                            <div class="flex items-center gap-3">
                                <p class="font-black text-xl text-secondary">${(data.totalPrice||0).toLocaleString()} <span class="text-[10px] font-normal">PHP</span></p>
                                <span class="status-badge ${getStatusClass(data.status)}">${data.status}</span>
                            </div>
                            <p class="text-[10px] font-bold text-blue-500 uppercase tracking-widest mt-1">${data.paymentMethod || 'GCash'}</p>
                        </div>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-3">
                        <button class="upd-btn flex-1 bg-primary text-secondary px-6 py-4 rounded-2xl font-bold hover:shadow-lg transition-all" data-status="Confirmed">Confirm Booking</button>
                        <button class="upd-btn flex-1 bg-secondary text-white px-6 py-4 rounded-2xl font-bold hover:shadow-lg transition-all" data-status="Payment Complete">Mark as Paid</button>
                        <button class="upd-btn flex-1 bg-red-50 text-red-500 px-6 py-4 rounded-2xl font-bold hover:bg-red-500 hover:text-white transition-all" data-status="Cancelled">Cancel/Delete</button>
                    </div>
                `;

                document.querySelectorAll('.upd-btn').forEach(b => b.addEventListener('click', async () => { 
                    const status = b.dataset.status;
                    if (status === 'Cancelled') {
                        if (!confirm('Are you sure you want to PERMANENTLY DELETE this booking?')) return;
                        await deleteDoc(doc(db, "bookings", id));
                    } else {
                        await updateDoc(doc(db, "bookings", id), { status: status }); 
                    }
                    modal.classList.add('hidden'); 
                    loadBookings(); 
                }));
            } catch(e) { console.error(e); }
        }

        document.getElementById('close-modal').addEventListener('click', () => document.getElementById('modal-overlay').classList.add('hidden'));

        function getStatusClass(s) { if (s === 'Confirmed') return 'status-confirmed'; if (s === 'Cancelled') return 'status-cancelled'; return 'status-pending'; }

        async function loadStats() {
            const revC = document.getElementById('stats-revenue-chart'); const volC = document.getElementById('stats-volume-chart');
            revC.innerHTML = 'Loading...'; volC.innerHTML = 'Loading...';
            try {
                const snap = await getDocs(collection(db, "bookings"));
                const stats = {};
                snap.forEach(d => { const data = d.data(); const t = data.tourId || 'Unknown'; if (!stats[t]) stats[t] = { r: 0, c: 0 }; stats[t].r += (data.totalPrice || 0); stats[t].c += 1; });
                revC.innerHTML = ''; volC.innerHTML = '';
                Object.keys(stats).forEach(t => { revC.innerHTML += `<div class="mb-4"><p class="text-sm font-bold uppercase">${t}</p><p class="text-primary font-black">${stats[t].r.toLocaleString()} PHP</p></div>`; volC.innerHTML += `<div class="mb-4"><p class="text-sm font-bold uppercase">${t}</p><p class="text-secondary font-black">${stats[t].c} Bookings</p></div>`; });
            } catch (e) {}
        }

        async function loadTours() {
            const list = document.getElementById('tours-list');
            list.innerHTML = '<div class="p-8 bg-white rounded-3xl border border-gray-100"><p class="font-bold">Hopping Tour</p><p class="text-primary">1,900 PHP</p></div><div class="p-8 bg-white rounded-3xl border border-gray-100"><p class="font-bold">Land Tour</p><p class="text-primary">700 PHP</p></div>';
        }
    </script>
</body>
</html>
