<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERP Dashboard | Pearl Of Sean Boracay</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#29D3D0",
                        secondary: "#062B43",
                        accent: "#F2C94C",
                        light: "#F8F9FA",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        heading: ["Montserrat", "serif"],
                    },
                },
            },
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-sidebar {
            background: #062B43;
            height: 100vh;
        }
        .nav-item.active {
            background: rgba(41, 211, 208, 0.1);
            color: #29D3D0;
            border-right: 4px solid #29D3D0;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-paid { background: #DBEAFE; color: #1E40AF; }
        .status-confirmed { background: #D1FAE5; color: #065F46; }
        .status-cancelled { background: #FEE2E2; color: #991B1B; }

        #login-screen {
            background: #062B43;
            background-image: radial-gradient(circle at top right, rgba(41, 211, 208, 0.1), transparent);
        }
    </style>
</head>
<body class="bg-light text-secondary antialiased font-sans">

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white rounded-[2.5rem] p-10 shadow-2xl text-center">
            <img src="pearl_of_sean_logo.png" alt="Logo" class="h-16 mx-auto mb-8">
            <h1 class="text-2xl font-heading font-bold mb-2">ERP Access</h1>
            <p class="text-gray-500 text-sm mb-8">Administrative portal for Pearl Of Sean</p>
            
            <form id="login-form" class="space-y-4">
                <input type="text" id="login-id" placeholder="Admin ID (e.g., luca)" required class="w-full bg-light border border-gray-100 rounded-2xl px-6 py-4 outline-none focus:border-primary transition-all">
                <button type="submit" class="w-full bg-secondary text-white py-4 rounded-2xl font-bold hover:bg-primary transition-all shadow-lg mt-4">Login to Dashboard</button>
            </form>
            <p id="login-error" class="text-red-500 text-xs mt-4 hidden">Invalid Admin ID.</p>
        </div>
    </div>

    <!-- Main Dashboard (Hidden by default) -->
    <div id="dashboard" class="hidden flex min-h-screen">
        <!-- Sidebar -->
        <aside class="admin-sidebar w-64 fixed inset-y-0 left-0 hidden lg:flex flex-col">
            <div class="p-8">
                <div class="flex items-center gap-3">
                    <img src="pearl_of_sean_logo.png" alt="Logo" class="h-8 filter brightness-0 invert">
                    <span class="text-white font-heading font-bold text-lg">ERP Admin</span>
                </div>
            </div>
            
            <nav class="mt-8 flex-grow">
                <button data-tab="bookings" class="nav-item active w-full flex items-center gap-4 px-8 py-4 text-gray-400 hover:text-white transition-all text-sm font-bold">
                    <i class="ph ph-calendar-check text-xl"></i> Bookings
                </button>
                <button data-tab="tours" class="nav-item w-full flex items-center gap-4 px-8 py-4 text-gray-400 hover:text-white transition-all text-sm font-bold">
                    <i class="ph ph-sailboat text-xl"></i> Tour Management
                </button>
                <button data-tab="stats" class="nav-item w-full flex items-center gap-4 px-8 py-4 text-gray-400 hover:text-white transition-all text-sm font-bold">
                    <i class="ph ph-chart-line-up text-xl"></i> Statistics
                </button>
            </nav>

            <div class="p-8 border-t border-white/5">
                <button id="logout-btn" class="w-full flex items-center gap-4 text-red-400 hover:text-red-300 font-bold text-sm">
                    <i class="ph ph-sign-out text-xl"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="lg:ml-64 flex-grow flex flex-col">
            <!-- Top Header -->
            <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-30">
                <h2 id="current-tab-title" class="text-xl font-heading font-bold">Booking Reservations</h2>
                <div class="flex items-center gap-6">
                    <span id="admin-user-email" class="text-sm font-medium text-gray-400">admin@pearl.of.sean</span>
                    <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold">AD</div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div id="tab-content" class="p-8">
                <!-- Bookings Tab -->
                <div id="tab-bookings" class="tab-pane">
                    <!-- Quick Stats Summary -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl bg-primary/10 text-primary flex items-center justify-center text-2xl">
                                <i class="ph ph-calendar-check"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Bookings</p>
                                <h4 id="stat-total-bookings" class="text-2xl font-bold">0</h4>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl bg-accent/10 text-accent-700 flex items-center justify-center text-2xl">
                                <i class="ph ph-currency-circle-dollar"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Revenue</p>
                                <h4 id="stat-total-revenue" class="text-2xl font-bold">0 PHP</h4>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl bg-secondary/10 text-secondary flex items-center justify-center text-2xl">
                                <i class="ph ph-users"></i>
                            </div>
                            <div>
                                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Guests</p>
                                <h4 id="stat-total-guests" class="text-2xl font-bold">0</h4>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-start md:items-center">
                        <div class="flex gap-4">
                            <select id="filter-tour" class="bg-white border border-gray-100 rounded-xl px-4 py-2 text-sm font-medium outline-none focus:border-primary">
                                <option value="all">All Tours</option>
                                <option value="yacht-hopping">Yacht Hopping</option>
                                <option value="land">Land Tour</option>
                            </select>
                            <select id="filter-status" class="bg-white border border-gray-100 rounded-xl px-4 py-2 text-sm font-medium outline-none focus:border-primary">
                                <option value="all">All Status</option>
                                <option value="Pending Payment">Pending</option>
                                <option value="Payment Complete">Paid</option>
                                <option value="Confirmed">Confirmed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="relative w-full md:w-64">
                            <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" placeholder="Search customer..." class="w-full bg-white border border-gray-100 rounded-xl pl-12 pr-4 py-2 text-sm outline-none focus:border-primary">
                        </div>
                    </div>

                    <!-- Bookings Table -->
                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-light border-b border-gray-100">
                                <tr>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Date</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Customer</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Tour</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Pax</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Total</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Status</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="bookings-list" class="divide-y divide-gray-50">
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Tours Tab -->
                <div id="tab-tours" class="tab-pane hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="tours-list">
                        <!-- Loaded via JS -->
                    </div>
                </div>

                <!-- Stats Tab -->
                <div id="tab-stats" class="tab-pane hidden">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-gray-100">
                            <h3 class="font-heading font-bold text-xl mb-8">Revenue by Tour</h3>
                            <div id="stats-revenue-chart" class="space-y-6">
                                <!-- Dynamic Stats -->
                            </div>
                        </div>
                        <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-gray-100">
                            <h3 class="font-heading font-bold text-xl mb-8">Booking Volume</h3>
                            <div id="stats-volume-chart" class="space-y-6">
                                <!-- Dynamic Stats -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Booking Detail Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-secondary/60 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-6">
        <div class="max-w-2xl w-full bg-white rounded-[2.5rem] p-10 shadow-2xl relative">
            <button id="close-modal" class="absolute top-8 right-8 text-gray-400 hover:text-secondary"><i class="ph ph-x text-2xl"></i></button>
            <div id="modal-body">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, getDocs, updateDoc, doc, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDqAd03xpQd_o3yXIFHv5t-BZWL6blvkmQ",
            authDomain: "boracaysean-local.firebaseapp.com",
            projectId: "boracaysean-local",
            storageBucket: "boracaysean-local.appspot.com",
            messagingSenderId: "673386650213",
            appId: "1:673386650213:web:484b15ee8b2d8ec226448c",
            measurementId: "G-DKC8HE000W"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- Auth Protection ---
        const loginScreen = document.getElementById('login-screen');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                dashboard.classList.remove('hidden');
                dashboard.classList.add('flex');
                document.getElementById('admin-user-email').textContent = user.email;
                loadBookings();
            } else {
                loginScreen.classList.remove('hidden');
                dashboard.classList.remove('flex');
                dashboard.classList.add('hidden');
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const adminId = document.getElementById('login-id').value; 
            
            // Map simple ID to email and fixed internal password for Firebase
            const email = adminId.includes('@') ? adminId : `${adminId}@pearl.of.sean`;
            const pass = adminId === 'luca' ? 'luca123' : adminId.padEnd(6, '0');
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                console.error(e);
                loginError.textContent = "Access Denied. Invalid Admin ID."; 
                loginError.classList.remove('hidden');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // --- Tab Management ---
        const navItems = document.querySelectorAll('.nav-item');
        const tabPanes = document.querySelectorAll('.tab-pane');
        const currentTabTitle = document.getElementById('current-tab-title');

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const targetTab = item.dataset.tab;
                navItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                tabPanes.forEach(pane => pane.classList.add('hidden'));
                document.getElementById(`tab-${targetTab}`).classList.remove('hidden');
                
                currentTabTitle.textContent = item.textContent.trim();
                if (targetTab === 'bookings') loadBookings();
                if (targetTab === 'tours') loadTours();
                if (targetTab === 'stats') loadStats();
            });
        });

        // --- Filtering ---
        const filterTour = document.getElementById('filter-tour');
        const filterStatus = document.getElementById('filter-status');

        filterTour.addEventListener('change', loadBookings);
        filterStatus.addEventListener('change', loadBookings);

        async function loadBookings() {
            const list = document.getElementById('bookings-list');
            list.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center text-gray-400">Loading ALL reservations...</td></tr>';
            
            try {
                // THE MOST BASIC QUERY POSSIBLE
                const q = collection(db, "bookings");
                const querySnapshot = await getDocs(q);
                list.innerHTML = '';
                
                alert("DEBUG: Found " + querySnapshot.size + " documents in database.");

                if (querySnapshot.empty) {
                    list.innerHTML = '<tr><td colspan="7" class="px-6 py-20 text-center text-gray-400">No reservations found in the database. (Total: 0)</td></tr>';
                    return;
                }

                let totalBookings = 0;
                let totalRevenue = 0;
                let totalGuests = 0;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    totalBookings++;
                    totalRevenue += (data.totalPrice || 0);
                    totalGuests += (data.paxAdult || 0) + (data.paxChild || 0);

                    const row = document.createElement('tr');
                    
                    // Safe data access
                    const date = data.tourDate ? (typeof data.tourDate.toDate === 'function' ? data.tourDate.toDate().toLocaleDateString() : (data.tourDate.seconds ? new Date(data.tourDate.seconds * 1000).toLocaleDateString() : 'N/A')) : 'N/A';
                    const customerName = data.customerName || 'Unknown Customer';
                    const contactPhone = data.contactPhone || 'No Phone';
                    const tourId = data.tourId || 'N/A';
                    const paxAdult = data.paxAdult || 0;
                    const paxChild = data.paxChild || 0;
                    const totalPrice = data.totalPrice !== undefined ? data.totalPrice.toLocaleString() : '0';
                    const status = data.status || 'Unknown';
                    
                    row.innerHTML = `
                        <td class="px-6 py-4 font-medium">${date}</td>
                        <td class="px-6 py-4">
                            <p class="font-bold">${customerName}</p>
                            <p class="text-xs text-gray-400">${contactPhone}</p>
                        </td>
                        <td class="px-6 py-4">
                            <span class="text-xs font-bold uppercase tracking-wider">${tourId}</span>
                            ${data.parentTour ? `<br><span class="text-[9px] bg-accent/20 text-accent-700 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter">${data.parentTour}</span>` : ''}
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">${paxAdult}A, ${paxChild}C</td>
                        <td class="px-6 py-4 font-bold">${totalPrice} PHP</td>
                        <td class="px-6 py-4">
                            <span class="status-badge ${getStatusClass(status)}">${status}</span>
                        </td>
                        <td class="px-6 py-4">
                            <button class="view-detail-btn text-primary hover:underline font-bold text-xs" data-id="${docSnap.id}">Manage</button>
                        </td>
                    `;
                    list.appendChild(row);
                });

                document.querySelectorAll('.view-detail-btn').forEach(btn => {
                    btn.addEventListener('click', () => viewBookingDetail(btn.dataset.id));
                });

                // Update Summary Stats UI
                document.getElementById('stat-total-bookings').textContent = totalBookings;
                document.getElementById('stat-total-revenue').textContent = `${totalRevenue.toLocaleString()} PHP`;
                document.getElementById('stat-total-guests').textContent = totalGuests;

            } catch (e) {
                console.error(e);
                alert("ADMIN ERROR: " + e.message);
                list.innerHTML = `<tr><td colspan="7" class="px-6 py-10 text-center text-red-400">ERROR: ${e.message}</td></tr>`;
            }
        }

        async function viewBookingDetail(id) {
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            modal.classList.remove('hidden');
            body.innerHTML = '<p class="text-center py-20">Loading details...</p>';

            try {
                const snap = await getDocs(query(collection(db, "bookings"), where("__name__", "==", id)));
                const data = snap.docs[0].data();

                body.innerHTML = `
                    <h3 class="text-2xl font-heading font-bold mb-8">Reservation Detail</h3>
                    <div class="grid grid-cols-2 gap-8 mb-10">
                        <div class="space-y-4">
                            <label class="text-[10px] uppercase font-bold text-gray-400 tracking-widest block">Customer Info</label>
                            <p class="font-bold text-lg">${data.customerName}</p>
                            <p class="text-gray-500">${data.contactPhone}<br>${data.contactEmail}</p>
                        </div>
                        <div class="space-y-4">
                            <label class="text-[10px] uppercase font-bold text-gray-400 tracking-widest block">Tour Info</label>
                            <p class="font-bold text-lg text-primary">${data.tourId.toUpperCase()}</p>
                            ${data.parentTour ? `<p class="text-[10px] bg-accent/20 text-accent-700 px-2 py-0.5 rounded-full font-bold uppercase tracking-tighter inline-block mb-2">Part of ${data.parentTour}</p>` : ''}
                            <p class="text-gray-500">${data.tourDate.toDate().toLocaleDateString()}<br>${data.paxAdult} Adult, ${data.paxChild} Child</p>
                        </div>
                        <div class="space-y-4">
                            <label class="text-[10px] uppercase font-bold text-gray-400 tracking-widest block">Payment</label>
                            <p class="font-bold text-xl">${data.totalPrice.toLocaleString()} PHP</p>
                            <p class="text-xs text-gray-400">Method: ${data.paymentMethod}</p>
                        </div>
                        <div class="space-y-4">
                            <label class="text-[10px] uppercase font-bold text-gray-400 tracking-widest block">Current Status</label>
                            <span class="status-badge ${getStatusClass(data.status)}">${data.status}</span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <label class="text-[10px] uppercase font-bold text-gray-400 tracking-widest block">Update Status</label>
                        <div class="flex flex-wrap gap-3">
                            <button class="status-upd-btn bg-light hover:bg-gray-100 px-4 py-2 rounded-xl text-xs font-bold" data-status="Pending Payment">Pending</button>
                            <button class="status-upd-btn bg-blue-50 text-blue-600 hover:bg-blue-100 px-4 py-2 rounded-xl text-xs font-bold" data-status="Payment Complete">Paid</button>
                            <button class="status-upd-btn bg-green-50 text-green-600 hover:bg-green-100 px-4 py-2 rounded-xl text-xs font-bold" data-status="Confirmed">Confirm</button>
                            <button class="status-upd-btn bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-xl text-xs font-bold" data-status="Cancelled">Cancel</button>
                        </div>
                    </div>
                `;

                document.querySelectorAll('.status-upd-btn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const newStatus = btn.dataset.status;
                        await updateDoc(doc(db, "bookings", id), { status: newStatus });
                        modal.classList.add('hidden');
                        loadBookings();
                    });
                });

            } catch (e) {
                body.innerHTML = '<p class="text-red-500">Error loading detail.</p>';
            }
        }

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('modal-overlay').classList.add('hidden');
        });

        function getStatusClass(status) {
            if (status === 'Pending Payment') return 'status-pending';
            if (status === 'Payment Complete') return 'status-paid';
            if (status === 'Confirmed') return 'status-confirmed';
            return 'status-cancelled';
        }

        async function loadStats() {
            const revenueContainer = document.getElementById('stats-revenue-chart');
            const volumeContainer = document.getElementById('stats-volume-chart');
            revenueContainer.innerHTML = '<p class="text-center py-10 text-gray-400">Loading stats...</p>';
            volumeContainer.innerHTML = '<p class="text-center py-10 text-gray-400">Loading stats...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "bookings"));
                const stats = {};
                
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    const tour = data.tourId || 'Unknown';
                    if (!stats[tour]) stats[tour] = { revenue: 0, count: 0 };
                    stats[tour].revenue += (data.totalPrice || 0);
                    stats[tour].count += 1;
                });

                revenueContainer.innerHTML = '';
                volumeContainer.innerHTML = '';

                const sortedTours = Object.keys(stats).sort((a, b) => stats[b].revenue - stats[a].revenue);
                const maxRevenue = Math.max(...Object.values(stats).map(s => s.revenue), 1);
                const maxCount = Math.max(...Object.values(stats).map(s => s.count), 1);

                sortedTours.forEach(tour => {
                    const s = stats[tour];
                    
                    // Revenue Bar
                    const revPerc = (s.revenue / maxRevenue) * 100;
                    revenueContainer.innerHTML += `
                        <div class="space-y-2">
                            <div class="flex justify-between text-sm font-bold">
                                <span>${tour.toUpperCase()}</span>
                                <span class="text-primary">${s.revenue.toLocaleString()} PHP</span>
                            </div>
                            <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                <div class="bg-primary h-full transition-all duration-1000" style="width: ${revPerc}%"></div>
                            </div>
                        </div>
                    `;

                    // Volume Bar
                    const volPerc = (s.count / maxCount) * 100;
                    volumeContainer.innerHTML += `
                        <div class="space-y-2">
                            <div class="flex justify-between text-sm font-bold">
                                <span>${tour.toUpperCase()}</span>
                                <span class="text-secondary">${s.count} Bookings</span>
                            </div>
                            <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                                <div class="bg-secondary h-full transition-all duration-1000" style="width: ${volPerc}%"></div>
                            </div>
                        </div>
                    `;
                });

            } catch (e) {
                console.error(e);
            }
        }

        async function loadTours() {
            const list = document.getElementById('tours-list');
            list.innerHTML = '';
            
            const tours = [
                { id: 'yacht-hopping', name: 'Yacht Hopping', price: 1900 },
                { id: 'land', name: 'Land Tour', price: 700 }
            ];

            tours.forEach(tour => {
                const card = document.createElement('div');
                card.className = 'bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <h4 class="font-bold text-xl">${tour.name}</h4>
                        <span class="bg-green-100 text-green-600 text-[10px] font-bold px-3 py-1 rounded-full">ACTIVE</span>
                    </div>
                    <div class="space-y-4 mb-8">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-400">Adult Price</span>
                            <span class="font-bold">${tour.price} PHP</span>
                        </div>
                    </div>
                    <button class="w-full bg-light hover:bg-gray-100 py-3 rounded-xl font-bold text-xs transition-all">Edit Configuration</button>
                `;
                list.appendChild(card);
            });
        }
    </script>
</body>
</html>
