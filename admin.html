<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERP Dashboard | Pearl Of Sean Boracay</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#29D3D0",
                        secondary: "#062B43",
                        accent: "#F2C94C",
                        light: "#F8F9FA",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        heading: ["Montserrat", "serif"],
                    },
                },
            },
        }
    </script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-sidebar {
            background: #062B43;
            height: 100vh;
        }
        .nav-item.active {
            background: rgba(41, 211, 208, 0.1);
            color: #29D3D0;
            border-right: 4px solid #29D3D0;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-paid { background: #DBEAFE; color: #1E40AF; }
        .status-confirmed { background: #D1FAE5; color: #065F46; }
        .status-cancelled { background: #FEE2E2; color: #991B1B; }

        #login-screen {
            background: #062B43;
            background-image: radial-gradient(circle at top right, rgba(41, 211, 208, 0.1), transparent);
        }
    </style>
</head>
<body class="bg-light text-secondary antialiased font-sans">

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white rounded-[2.5rem] p-10 shadow-2xl text-center">
            <img src="pearl_of_sean_logo.png" alt="Logo" class="h-16 mx-auto mb-8">
            <h1 class="text-2xl font-heading font-bold mb-2">ERP Access</h1>
            <p class="text-gray-500 text-sm mb-8">Administrative portal for Pearl Of Sean</p>
            <form id="login-form" class="space-y-4">
                <input type="text" id="login-id" placeholder="Admin ID (e.g., luca)" required class="w-full bg-light border border-gray-100 rounded-2xl px-6 py-4 outline-none focus:border-primary transition-all">
                <button type="submit" class="w-full bg-secondary text-white py-4 rounded-2xl font-bold hover:bg-primary transition-all shadow-lg mt-4">Login to Dashboard</button>
            </form>
            <p id="login-error" class="text-red-500 text-xs mt-4 hidden">Invalid Admin ID.</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden flex min-h-screen">
        <aside class="admin-sidebar w-64 fixed inset-y-0 left-0 hidden lg:flex flex-col">
            <div class="p-8">
                <div class="flex items-center gap-3">
                    <img src="pearl_of_sean_logo.png" alt="Logo" class="h-8 filter brightness-0 invert">
                    <span class="text-white font-heading font-bold text-lg">ERP Admin</span>
                </div>
            </div>
            <nav class="mt-8 flex-grow">
                <button data-tab="bookings" class="nav-item active w-full flex items-center gap-4 px-8 py-4 text-gray-400 hover:text-white transition-all text-sm font-bold"><i class="ph ph-calendar-check text-xl"></i> Bookings</button>
                <button data-tab="tours" class="nav-item w-full flex items-center gap-4 px-8 py-4 text-gray-400 hover:text-white transition-all text-sm font-bold"><i class="ph ph-sailboat text-xl"></i> Tour Management</button>
                <button data-tab="stats" class="nav-item w-full flex items-center gap-4 px-8 py-4 text-gray-400 hover:text-white transition-all text-sm font-bold"><i class="ph ph-chart-line-up text-xl"></i> Statistics</button>
            </nav>
            <div class="p-8 border-t border-white/5">
                <button id="logout-btn" class="w-full flex items-center gap-4 text-red-400 hover:text-red-300 font-bold text-sm"><i class="ph ph-sign-out text-xl"></i> Logout</button>
            </div>
        </aside>

        <main class="lg:ml-64 flex-grow flex flex-col">
            <header class="h-20 bg-white border-b border-gray-100 flex items-center justify-between px-8 sticky top-0 z-30">
                <div class="flex items-center gap-4">
                    <h2 id="current-tab-title" class="text-xl font-heading font-bold">Booking Reservations</h2>
                    <button id="db-test-btn" class="bg-accent text-accent-700 px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest hover:scale-105 transition-all">DB Connection Test</button>
                </div>
                <div class="flex items-center gap-6">
                    <span id="admin-user-email" class="text-sm font-medium text-gray-400">admin@pearl.of.sean</span>
                    <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold">AD</div>
                </div>
            </header>

            <div id="tab-content" class="p-8">
                <div id="tab-bookings" class="tab-pane">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl bg-primary/10 text-primary flex items-center justify-center text-2xl"><i class="ph ph-calendar-check"></i></div>
                            <div><p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Bookings</p><h4 id="stat-total-bookings" class="text-2xl font-bold">0</h4></div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl bg-accent/10 text-accent-700 flex items-center justify-center text-2xl"><i class="ph ph-currency-circle-dollar"></i></div>
                            <div><p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Revenue</p><h4 id="stat-total-revenue" class="text-2xl font-bold">0 PHP</h4></div>
                        </div>
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-5">
                            <div class="w-12 h-12 rounded-2xl bg-secondary/10 text-secondary flex items-center justify-center text-2xl"><i class="ph ph-users"></i></div>
                            <div><p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Guests</p><h4 id="stat-total-guests" class="text-2xl font-bold">0</h4></div>
                        </div>
                    </div>

                    <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-start md:items-center">
                        <div class="flex gap-4">
                            <select id="filter-tour" class="bg-white border border-gray-100 rounded-xl px-4 py-2 text-sm font-medium outline-none focus:border-primary">
                                <option value="all">All Tours</option>
                                <option value="yacht-hopping">Yacht Hopping</option>
                                <option value="land">Land Tour</option>
                            </select>
                            <select id="filter-status" class="bg-white border border-gray-100 rounded-xl px-4 py-2 text-sm font-medium outline-none focus:border-primary">
                                <option value="all">All Status</option>
                                <option value="Pending Payment">Pending</option>
                                <option value="Payment Complete">Paid</option>
                                <option value="Confirmed">Confirmed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="relative w-full md:w-64">
                            <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <input type="text" placeholder="Search customer..." class="w-full bg-white border border-gray-100 rounded-xl pl-12 pr-4 py-2 text-sm outline-none focus:border-primary">
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-light border-b border-gray-100">
                                <tr>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Date</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Customer</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Tour</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Pax</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Total</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Method</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Status</th>
                                    <th class="px-6 py-4 text-xs font-bold uppercase tracking-wider text-gray-400">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="bookings-list" class="divide-y divide-gray-50"></tbody>
                        </table>
                    </div>
                </div>
                <div id="tab-tours" class="tab-pane hidden"><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="tours-list"></div></div>
                <div id="tab-stats" class="tab-pane hidden"><div class="grid grid-cols-1 lg:grid-cols-2 gap-8"><div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-gray-100" id="stats-revenue-chart"></div><div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-gray-100" id="stats-volume-chart"></div></div></div>
            </div>
        </main>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-secondary/60 backdrop-blur-sm z-[200] hidden flex items-center justify-center p-6"><div class="max-w-2xl w-full bg-white rounded-[2.5rem] p-10 shadow-2xl relative"><button id="close-modal" class="absolute top-8 right-8 text-gray-400 hover:text-secondary"><i class="ph ph-x text-2xl"></i></button><div id="modal-body"></div></div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, getDocs, updateDoc, deleteDoc, doc, where, addDoc, serverTimestamp, initializeFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDqAd03xpQd_o3yXIFHv5t-BZWL6blvkmQ",
            authDomain: "boracaysean-local.firebaseapp.com",
            projectId: "boracaysean-local",
            storageBucket: "boracaysean-local.appspot.com",
            messagingSenderId: "673386650213",
            appId: "1:673386650213:web:484b15ee8b2d8ec226448c",
            measurementId: "G-DKC8HE000W"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // FORCE LONG-POLLING TO FIX TIMEOUTS
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });

        document.getElementById('db-test-btn').addEventListener('click', async () => {
            alert("Starting DB Write Test (8s timeout)...\nIf this fails, Project ID is wrong or Rules are Locked.");
            const tPromise = new Promise((_, r) => setTimeout(() => r(new Error("Database connection timed out. CHECK RULES!")), 8000));
            try {
                const wPromise = addDoc(collection(db, "bookings"), { customerName: "TEST_" + Date.now(), tourId: "test", status: "Confirmed", createdAt: serverTimestamp(), isTest: true });
                const docRef = await Promise.race([wPromise, tPromise]);
                alert("WRITE SUCCESS! Doc ID: " + docRef.id); loadBookings();
            } catch (e) { alert("WRITE FAILED: " + e.message); }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('flex');
                document.getElementById('admin-user-email').textContent = user.email;
                loadBookings();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const adminId = document.getElementById('login-id').value; 
            const email = adminId.includes('@') ? adminId : `${adminId}@pearl.of.sean`;
            const pass = adminId === 'luca' ? 'luca123' : adminId.padEnd(6, '0');
            try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { document.getElementById('login-error').classList.remove('hidden'); }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                const targetTab = item.dataset.tab;
                navItems.forEach(i => i.classList.remove('active')); item.classList.add('active');
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
                document.getElementById(`tab-${targetTab}`).classList.remove('hidden');
                document.getElementById('current-tab-title').textContent = item.textContent.trim();
                if (targetTab === 'bookings') loadBookings();
                if (targetTab === 'stats') loadStats();
                if (targetTab === 'tours') loadTours();
            });
        });

        async function loadBookings() {
            const list = document.getElementById('bookings-list');
            list.innerHTML = '<tr><td colspan="7" class="px-6 py-10 text-center">Loading...</td></tr>';
            try {
                const q = collection(db, "bookings");
                const snap = await getDocs(q);
                list.innerHTML = '';
                if (snap.empty) { list.innerHTML = '<tr><td colspan="7" class="px-6 py-20 text-center">No reservations found.</td></tr>'; return; }
                let totalB = 0, totalR = 0, totalG = 0;
                snap.forEach(docSnap => {
                    const data = docSnap.data(); totalB++; totalR += (data.totalPrice || 0); totalG += (data.paxAdult || 0) + (data.paxChild || 0);
                    const row = document.createElement('tr');
                    const date = data.tourDate ? (data.tourDate.toDate ? data.tourDate.toDate().toLocaleDateString() : new Date(data.tourDate.seconds*1000).toLocaleDateString()) : 'N/A';
                    row.innerHTML = `<td class="px-6 py-4 font-medium">${date}</td><td class="px-6 py-4"><p class="font-bold">${data.customerName || 'N/A'}</p><p class="text-xs text-gray-400">${data.contactPhone || ''}</p></td><td class="px-6 py-4"><span class="text-xs font-bold uppercase">${data.tourId || 'N/A'}</span></td><td class="px-6 py-4 text-sm">${data.paxAdult}A, ${data.paxChild}C</td><td class="px-6 py-4 font-bold">${(data.totalPrice||0).toLocaleString()} PHP</td><td class="px-6 py-4"><span class="text-xs font-bold text-blue-500">${data.paymentMethod || 'GCash'}</span></td><td class="px-6 py-4"><span class="status-badge ${getStatusClass(data.status)}">${data.status}</span></td><td class="px-6 py-4"><button class="text-primary font-bold text-xs view-btn" data-id="${docSnap.id}">Manage</button></td>`;
                    list.appendChild(row);
                });
                document.querySelectorAll('.view-btn').forEach(b => b.addEventListener('click', () => viewBookingDetail(b.dataset.id)));
                document.getElementById('stat-total-bookings').textContent = totalB;
                document.getElementById('stat-total-revenue').textContent = `${totalR.toLocaleString()} PHP`;
                document.getElementById('stat-total-guests').textContent = totalG;
            } catch (e) { console.error(e); }
        }

        async function viewBookingDetail(id) {
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            modal.classList.remove('hidden');
            body.innerHTML = 'Loading...';
            try {
                const snap = await getDocs(query(collection(db, "bookings"), where("__name__", "==", id)));
                const data = snap.docs[0].data();
                body.innerHTML = `<h3 class="text-2xl font-bold mb-8">Reservation Detail</h3><div class="grid grid-cols-2 gap-8 mb-10 text-sm"><div><label class="text-gray-400 block mb-1">Customer</label><p class="font-bold">${data.customerName}</p><p>${data.contactPhone}</p></div><div><label class="text-gray-400 block mb-1">Tour</label><p class="font-bold">${data.tourId.toUpperCase()}</p><p>${data.paxAdult}A, ${data.paxChild}C</p></div><div><label class="text-gray-400 block mb-1">Payment</label><p class="font-bold">${(data.totalPrice||0).toLocaleString()} PHP</p><p class="text-xs text-primary">${data.paymentMethod || 'GCash'}</p></div><div><label class="text-gray-400 block mb-1">Status</label><span class="status-badge ${getStatusClass(data.status)}">${data.status}</span></div></div><div class="flex gap-2"><button class="upd-btn bg-green-500 text-white px-4 py-2 rounded-lg text-xs font-bold" data-status="Confirmed">Confirm</button><button class="upd-btn bg-red-500 text-white px-4 py-2 rounded-lg text-xs font-bold" data-status="Cancelled">Cancel</button></div>`;
                document.querySelectorAll('.upd-btn').forEach(b => b.addEventListener('click', async () => { 
                    const status = b.dataset.status;
                    if (status === 'Cancelled') {
                        if (confirm('Are you sure you want to PERMANENTLY DELETE this booking?')) {
                            await deleteDoc(doc(db, "bookings", id));
                        } else {
                            return;
                        }
                    } else {
                        await updateDoc(doc(db, "bookings", id), { status: status }); 
                    }
                    modal.classList.add('hidden'); 
                    loadBookings(); 
                }));
            } catch(e) {}
        }

        document.getElementById('close-modal').addEventListener('click', () => document.getElementById('modal-overlay').classList.add('hidden'));

        function getStatusClass(s) { if (s === 'Confirmed') return 'status-confirmed'; if (s === 'Cancelled') return 'status-cancelled'; return 'status-pending'; }

        async function loadStats() {
            const revC = document.getElementById('stats-revenue-chart'); const volC = document.getElementById('stats-volume-chart');
            revC.innerHTML = 'Loading...'; volC.innerHTML = 'Loading...';
            try {
                const snap = await getDocs(collection(db, "bookings"));
                const stats = {};
                snap.forEach(d => { const data = d.data(); const t = data.tourId || 'Unknown'; if (!stats[t]) stats[t] = { r: 0, c: 0 }; stats[t].r += (data.totalPrice || 0); stats[t].c += 1; });
                revC.innerHTML = ''; volC.innerHTML = '';
                Object.keys(stats).forEach(t => { revC.innerHTML += `<div class="mb-4"><p class="text-sm font-bold uppercase">${t}</p><p class="text-primary font-black">${stats[t].r.toLocaleString()} PHP</p></div>`; volC.innerHTML += `<div class="mb-4"><p class="text-sm font-bold uppercase">${t}</p><p class="text-secondary font-black">${stats[t].c} Bookings</p></div>`; });
            } catch (e) {}
        }

        async function loadTours() {
            const list = document.getElementById('tours-list');
            list.innerHTML = '<div class="p-8 bg-white rounded-3xl border border-gray-100"><p class="font-bold">Hopping Tour</p><p class="text-primary">1,900 PHP</p></div><div class="p-8 bg-white rounded-3xl border border-gray-100"><p class="font-bold">Land Tour</p><p class="text-primary">700 PHP</p></div>';
        }
    </script>
</body>
</html>
