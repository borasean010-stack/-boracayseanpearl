<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Your Voyage | Pearl Of Sean Boracay</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#29D3D0', secondary: '#062B43' },
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="style.css">
    <style>
        .booking-card { background: rgba(6, 43, 67, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-luxury { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #FFFFFF; }
        
        /* TINY Calendar Styling */
        .calendar-wrapper { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 1rem; 
            padding: 0.5rem;
            width: 100%;
            max-width: 240px;
        }
        .days-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
        .calendar-day { 
            aspect-ratio: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 0.6rem; 
            font-weight: 500; 
            border-radius: 50%; 
            color: rgba(255, 255, 255, 0.5); 
        }
        .calendar-day:hover:not(.disabled):not(.selected) { background: rgba(41, 211, 208, 0.2); color: #29D3D0; }
        .calendar-day.selected { background: #29D3D0; color: #062B43; font-weight: 800; }
        .calendar-day.today { border: 1px solid rgba(41, 211, 208, 0.3); }
        .calendar-day.disabled { opacity: 0.1; cursor: not-allowed; }
        .calendar-header-day { 
            text-align: center; 
            font-size: 0.5rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            color: rgba(255, 255, 255, 0.2); 
            padding-bottom: 0.2rem; 
        }
        .current-month { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #FFFFFF; }

        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-secondary text-white antialiased overflow-x-hidden font-sans min-h-screen flex flex-col">

    <!-- Background Video -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <iframe class="video-cover absolute top-1/2 left-1/2" src="https://www.youtube.com/embed/JLUPK8g5BZs?autoplay=1&mute=1&loop=1&playlist=JLUPK8g5BZs&controls=0&showinfo=0&rel=0&iv_load_policy=3&modestbranding=1&vq=hd1080&enablejsapi=1&playsinline=1" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        <div class="absolute inset-0 bg-secondary/70 backdrop-blur-[2px]"></div>
    </div>

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full z-50 bg-transparent py-4">
        <div class="px-8 flex justify-between items-center">
            <a href="index.html"><img src="pearl_of_sean_logo.png" alt="Logo" class="h-8"></a>
            <a href="index.html" class="text-[10px] font-bold uppercase tracking-widest text-white">Home</a>
        </div>
    </header>

    <div class="relative z-10 container mx-auto px-6 max-w-6xl flex-grow flex items-center justify-center py-24">
        <div class="booking-card rounded-[2.5rem] p-8 md:p-12 fade-up w-full">
            <form id="booking-form" class="space-y-10">
                <input type="hidden" name="tour_id" id="tour-input">
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <!-- Left Column -->
                    <div class="space-y-10">
                        <!-- Contact Information -->
                        <div class="space-y-4">
                            <label class="text-[10px] font-black text-primary tracking-[0.2em] uppercase">Contact Information</label>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="space-y-1">
                                    <p class="text-[9px] text-gray-500 uppercase font-bold ml-1">Full Name</p>
                                    <input type="text" name="name" required class="input-luxury w-full px-5 py-3 rounded-xl outline-none text-base">
                                </div>
                                <div class="space-y-1">
                                    <p class="text-[9px] text-gray-500 uppercase font-bold ml-1">Phone Number</p>
                                    <input type="tel" name="phone" required class="input-luxury w-full px-5 py-3 rounded-xl outline-none text-base">
                                </div>
                                <div class="md:col-span-2 space-y-1">
                                    <p class="text-[9px] text-gray-500 uppercase font-bold ml-1">Email Address</p>
                                    <input type="email" name="email" required class="input-luxury w-full px-5 py-3 rounded-xl outline-none text-base">
                                </div>
                            </div>
                        </div>

                        <!-- Tiny Calendars -->
                        <div class="space-y-4">
                            <label id="calendar-label" class="text-[10px] font-black text-primary tracking-[0.2em] uppercase">Select Voyage Dates</label>
                            <div id="calendar-grid" class="grid grid-cols-1 gap-6 items-start">
                                <!-- Calendar 1 -->
                                <div class="space-y-2">
                                    <p id="label-cal-1" class="text-[9px] text-gray-500 uppercase font-bold text-center"></p>
                                    <div id="calendar-1" class="calendar-wrapper">
                                        <div class="flex items-center justify-center gap-6 mb-2">
                                            <button type="button" class="prev-month text-white"><i class="ph ph-caret-left-bold text-base"></i></button>
                                            <h4 class="current-month">Month</h4>
                                            <button type="button" class="next-month text-white"><i class="ph ph-caret-right-bold text-base"></i></button>
                                        </div>
                                        <div class="grid grid-cols-7 mb-1">
                                            <div class="calendar-header-day">S</div><div class="calendar-header-day">M</div><div class="calendar-header-day">T</div><div class="calendar-header-day">W</div><div class="calendar-header-day">T</div><div class="calendar-header-day">F</div><div class="calendar-header-day">S</div>
                                        </div>
                                        <div class="days-container"></div>
                                        <input type="hidden" name="date_1" id="date-1-input">
                                    </div>
                                </div>

                                <!-- Calendar 2 -->
                                <div id="calendar-2-wrapper" class="hidden space-y-2">
                                    <p class="text-[9px] text-gray-500 uppercase font-bold text-center">Yacht Hopping Date</p>
                                    <div id="calendar-2" class="calendar-wrapper">
                                        <div class="flex items-center justify-center gap-6 mb-2">
                                            <button type="button" class="prev-month text-white"><i class="ph ph-caret-left-bold text-base"></i></button>
                                            <h4 class="current-month">Month</h4>
                                            <button type="button" class="next-month text-white"><i class="ph ph-caret-right-bold text-base"></i></button>
                                        </div>
                                        <div class="grid grid-cols-7 mb-1">
                                            <div class="calendar-header-day">S</div><div class="calendar-header-day">M</div><div class="calendar-header-day">T</div><div class="calendar-header-day">W</div><div class="calendar-header-day">T</div><div class="calendar-header-day">F</div><div class="calendar-header-day">S</div>
                                        </div>
                                        <div class="days-container"></div>
                                        <input type="hidden" name="date_2" id="date-2-input">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Diagrammed Action Row -->
                        <div class="flex items-stretch justify-between gap-4 pt-6 border-t border-white/5">
                            <div class="space-y-2 flex-grow max-w-[200px]">
                                <!-- 성인 -->
                                <div class="flex items-center justify-between bg-white/5 px-4 py-2 rounded-xl border border-white/10">
                                    <p class="text-[10px] font-bold text-gray-400">성인</p>
                                    <div class="flex items-center gap-3">
                                        <button type="button" class="pax-btn text-primary" data-type="adults" data-action="minus"><i class="ph-bold ph-minus"></i></button>
                                        <input type="number" id="pax-adults" value="1" readonly class="w-4 bg-transparent text-center font-bold text-sm text-white outline-none">
                                        <button type="button" class="pax-btn text-primary" data-type="adults" data-action="plus"><i class="ph-bold ph-plus"></i></button>
                                    </div>
                                </div>
                                <!-- 소인 -->
                                <div class="flex items-center justify-between bg-white/5 px-4 py-2 rounded-xl border border-white/10">
                                    <p class="text-[10px] font-bold text-gray-400">소인</p>
                                    <div class="flex items-center gap-3">
                                        <button type="button" class="pax-btn text-primary" data-type="children" data-action="minus"><i class="ph-bold ph-minus"></i></button>
                                        <input type="number" id="pax-children" value="0" readonly class="w-4 bg-transparent text-center font-bold text-sm text-white outline-none">
                                        <button type="button" class="pax-btn text-primary" data-type="children" data-action="plus"><i class="ph-bold ph-plus"></i></button>
                                    </div>
                                </div>
                            </div>
                            <!-- Tall 결제하기 Button -->
                            <button type="button" id="proceed-to-payment" class="bg-primary text-secondary px-10 rounded-2xl font-black text-xl hover:bg-white transition-all shadow-xl flex-shrink-0 flex items-center justify-center">결제하기</button>
                        </div>
                    </div>

                    <!-- Right Column (Status/Price Card) -->
                    <div class="space-y-6">
                        <div class="bg-primary p-8 rounded-[2.5rem] text-secondary shadow-xl h-full flex flex-col justify-between">
                            <div>
                                <div id="tour-icon-box" class="text-4xl mb-6"><i class="ph ph-sparkles text-secondary"></i></div>
                                <h3 id="tour-name-display" class="text-3xl font-heading font-black mb-2 uppercase italic tracking-tighter leading-none">Tour Name</h3>
                                <p class="text-secondary/60 text-sm font-medium">Premium Experience</p>
                            </div>
                            <div class="pt-10 border-t border-secondary/10">
                                <div class="flex items-baseline gap-2">
                                    <span id="estimated-total" class="text-5xl font-black">0 PHP</span>
                                    <span class="text-[10px] uppercase font-bold opacity-40">Total</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <!-- Payment Section -->
            <div id="payment-section" class="hidden space-y-10">
                <div class="text-center"><h3 class="text-3xl font-bold text-white mb-2">Final Step</h3><p class="text-gray-400 text-sm">Secure your premium voyage</p></div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 text-white">
                    <div class="bg-white/5 p-8 rounded-[2.5rem] border border-white/10 space-y-6">
                        <h4 class="text-xs uppercase font-bold text-primary tracking-widest">Reservation Summary</h4>
                        <div class="space-y-4 text-sm">
                            <div class="flex justify-between border-b border-white/5 pb-2"><p class="text-gray-400">Experience</p><p id="summary-tour-name" class="font-bold"></p></div>
                            <div class="flex justify-between border-b border-white/5 pb-2"><p class="text-gray-400">Date(s)</p><p id="summary-date" class="font-bold text-right text-xs"></p></div>
                            <div class="flex justify-between text-primary pt-2"><p class="font-bold">Total Investment</p><p id="summary-total" class="text-2xl font-black"></p></div>
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 gap-3">
                            <label class="flex items-center gap-4 p-4 rounded-xl bg-white/5 border border-white/10 cursor-pointer hover:bg-white/10 transition-all"><input type="radio" name="payment_method" value="GCash" checked class="accent-primary w-5 h-5"><div class="w-10 h-10 bg-white rounded-lg overflow-hidden"><img src="gcash.jpg" class="w-full h-full object-cover"></div><p class="font-bold text-sm">GCash / Local</p></label>
                            <label class="flex items-center gap-4 p-4 rounded-xl bg-white/5 border border-white/10 cursor-pointer hover:bg-white/10 transition-all"><input type="radio" name="payment_method" value="PayPal" class="accent-primary w-5 h-5"><div class="w-10 h-10 bg-white rounded-lg p-1"><img src="https://www.paypalobjects.com/webstatic/mktg/logo/pp_cc_mark_37x23.jpg" class="w-full h-auto"></div><p class="font-bold text-sm">PayPal / Cards</p></label>
                        </div>
                        <div class="flex gap-4"><button type="button" id="back-to-form" class="flex-1 bg-white/5 text-white py-4 rounded-xl font-bold hover:bg-white/10">Edit</button><button type="button" id="pay-now" class="flex-[2] bg-primary text-secondary py-4 rounded-xl font-black hover:bg-white">결제하기</button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, initializeFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const config = { apiKey: "AIzaSyDqAd03xpQd_o3yXIFHv5t-BZWL6blvkmQ", authDomain: "boracaysean-local.firebaseapp.com", projectId: "boracaysean-local", storageBucket: "boracaysean-local.appspot.com", messagingSenderId: "673386650213", appId: "1:673386650213:web:484b15ee8b2d8ec226448c" };
        const app = initializeApp(config);
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });

        const tourMap = { 'land': { id: 'land', name: 'Land Tour', price: 700 }, 'yacht': { id: 'yacht', name: 'Hopping Tour', price: 1900 }, 'combo': { id: 'combo', name: 'Combo Tour', price: 2500, isCombo: true } };

        class Calendar {
            constructor(cid, iid) {
                this.c = document.getElementById(cid); this.i = document.getElementById(iid);
                this.m = this.c.querySelector('.current-month'); this.d = this.c.querySelector('.days-container');
                this.p = this.c.querySelector('.prev-month'); this.n = this.c.querySelector('.next-month');
                this.v = new Date(); this.s = null;
                this.p.onclick = (e) => { e.preventDefault(); this.v.setMonth(this.v.getMonth()-1); this.r(); };
                this.n.onclick = (e) => { e.preventDefault(); this.v.setMonth(this.v.getMonth()+1); this.r(); };
                this.r();
            }
            r() {
                const y = this.v.getFullYear(), m = this.v.getMonth();
                this.m.textContent = new Intl.DateTimeFormat('en-US', {month:'short', year:'numeric'}).format(this.v);
                this.d.innerHTML = '';
                const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate(), today = new Date(); today.setHours(0,0,0,0);
                for (let i=0; i<first; i++) this.d.appendChild(document.createElement('div'));
                for (let day=1; day<=days; day++) {
                    const el = document.createElement('div'); el.className = 'calendar-day'; el.textContent = day;
                    const date = new Date(y, m, day);
                    if (date < today) el.classList.add('disabled');
                    else {
                        el.onclick = () => { this.s = date; this.i.value = date.toISOString(); this.r(); upd(); };
                        if (this.s && date.getTime() === this.s.getTime()) el.classList.add('selected');
                        if (date.getTime() === today.getTime()) el.classList.add('today');
                    }
                    this.d.appendChild(el);
                }
            }
        }

        let c1, c2;
        function upd() {
            const url = new URLSearchParams(window.location.search);
            const tour = tourMap[url.get('tour') || 'yacht'];
            const ad = parseInt(document.getElementById('pax-adults').value);
            const tot = ad * tour.price;
            document.getElementById('estimated-total').textContent = tot.toLocaleString() + ' PHP';
            document.getElementById('summary-total').textContent = tot.toLocaleString() + ' PHP';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const url = new URLSearchParams(window.location.search);
            const tour = tourMap[url.get('tour') || 'yacht'];
            document.getElementById('tour-name-display').textContent = tour.name;
            document.getElementById('tour-input').value = tour.id;

            if (tour.isCombo) {
                document.getElementById('calendar-grid').classList.add('grid-cols-2');
                document.getElementById('calendar-2-wrapper').classList.remove('hidden');
                document.getElementById('label-cal-1').textContent = 'Land Tour Date';
                c1 = new Calendar('calendar-1', 'date-1-input');
                c2 = new Calendar('calendar-2', 'date-2-input');
            } else {
                document.getElementById('label-cal-1').textContent = tour.name + ' Date';
                c1 = new Calendar('calendar-1', 'date-1-input');
            }

            document.querySelectorAll('.pax-btn').forEach(b => {
                b.onclick = () => {
                    const input = document.getElementById(`pax-${b.dataset.type}`);
                    let v = parseInt(input.value);
                    if (b.dataset.action === 'plus') v++;
                    else if (v > (b.dataset.type === 'adults' ? 1 : 0)) v--;
                    input.value = v; upd();
                };
            });

            document.getElementById('proceed-to-payment').onclick = () => {
                if (!c1.s || (tour.isCombo && !c2.s)) { alert('Select dates!'); return; }
                document.getElementById('summary-tour-name').textContent = tour.name;
                document.getElementById('summary-date').innerHTML = tour.isCombo ? `Land: ${c1.s.toLocaleDateString()}<br>Yacht: ${c2.s.toLocaleDateString()}` : c1.s.toLocaleDateString();
                document.getElementById('booking-form').classList.add('hidden');
                document.getElementById('payment-section').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            document.getElementById('back-to-form').onclick = () => { document.getElementById('payment-section').classList.add('hidden'); document.getElementById('booking-form').classList.remove('hidden'); };

            document.getElementById('pay-now').onclick = async () => {
                try {
                    const btn = document.getElementById('pay-now'); btn.disabled = true; btn.innerHTML = "Processing...";
                    const payload = {
                        customerName: document.getElementsByName('name')[0].value,
                        contactPhone: document.getElementsByName('phone')[0].value,
                        contactEmail: document.getElementsByName('email')[0].value,
                        paxAdult: parseInt(document.getElementById('pax-adults').value),
                        paxChild: parseInt(document.getElementById('pax-children').value),
                        paymentMethod: document.querySelector('input[name="payment_method"]:checked').value,
                        status: 'Pending Payment',
                        tourId: tour.id,
                        tourName: tour.name,
                        tourDate: c1.s,
                        totalPrice: parseInt(document.getElementById('pax-adults').value) * tour.price,
                        createdAt: serverTimestamp()
                    };
                    if (tour.isCombo) payload.tourDate_2 = c2.s;
                    await addDoc(collection(db, "bookings"), payload);
                    window.location.href = 'thank-you.html';
                } catch (e) { alert(e.message); document.getElementById('pay-now').disabled = false; }
            };
            upd();
        });
    </script>
</body>
</html>
